name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# Ayni dal icin ust uste itmelerde eskiyen kosuyu iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Surum is ADINA gomulemez: `env` baglami `jobs.<id>.name` alaninda gecerli
    # degil ve boyle bir ifade workflow'u dogrulama asamasinda tumden reddettirir
    # (kosu kaydi olusur ama HIC is baslamaz, adim hatasi gibi gorunmez).
    # Surum tek yerde, setup-python adiminda duruyor.
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Kurulu surumler
        run: pip list | grep -Ei "fastapi|starlette|uvicorn|pydantic|yt-dlp|youtube-transcript"

      - name: Uygulama import edilebiliyor mu
        # Testlerden ONCE: 204/response_class hatasi import zamaninda olusuyordu
        # ve yalnizca bu adim onu tek basina yakalar.
        run: python -c "from api.main import app; print(f'{len(app.routes)} rota kayitli')"

      - name: Kullanilmayan import / tanimsiz ad
        run: python -m pyflakes src api tests

      - name: Testler
        # `.env` ve API anahtari YOK: testler ag ve gizli bilgi olmadan gecmeli.
        run: python -m pytest -q

  minimum-deps:
    name: En dusuk bagimlilik surumleri
    runs-on: ubuntu-latest

    # `requirements.txt` bir ARALIK bildiriyor ama gelistirme her zaman araligin
    # ustunde yapiliyor. Bu oturumda tam olarak bu yuzden bir hata kacti:
    # FastAPI 0.116'da `-> None` + 204 uygulamayi import zamaninda kiriyordu,
    # gelistirme ortamindaki 0.118'de ise sorun yoktu.
    #
    # Bu is, bildirilen alt sinirlari kurup ayni kontrolleri kosuyor: yani
    # "destekliyoruz" dedigimiz surumde gercekten calistigini dogruluyor.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Alt sinir surumlerini kur
        run: |
          python -m pip install --upgrade pip
          # `>=X,<Y` araliklarini `==X`e cevir
          sed -E 's/>=([0-9][^,]*),<[^ ]*/==\1/; s/>=([0-9].*)$/==\1/' requirements.txt \
            | grep -v '^#' | grep -v '^$' > constraints-min.txt
          echo "--- alt sinirlar ---"; cat constraints-min.txt
          pip install -r constraints-min.txt

      - name: Kurulu surumler
        run: pip list | grep -Ei "fastapi|starlette|uvicorn|pydantic"

      - name: Uygulama import edilebiliyor mu
        run: python -c "from api.main import app; print(f'{len(app.routes)} rota kayitli')"

      - name: Testler
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bagimliliklari kur
        run: npm ci

      - name: Tip kontrolu
        run: npm run typecheck

      - name: Derleme
        run: npm run build

  secrets:
    name: Gizli bilgi taramasi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Gecmisi de tara: bir anahtar eski bir commit'te kalmis olabilir.
          fetch-depth: 0

      - name: API anahtari deseni (calisma agaci + gecmis)
        run: |
          PATTERN="AIza[0-9A-Za-z_-]{30,}|BEGIN [A-Z ]*PRIVATE KEY"

          if git grep -I -n -E "$PATTERN" -- . ; then
            echo "::error::Calisma agacinda gizli bilgi deseni bulundu"
            exit 1
          fi

          # `git grep` revizyon verilmeden YALNIZCA calisma agacini tarar; yukaridaki
          # adim tek basina gecmisi kapsamiyordu. Herkese acik bir depoda sonradan
          # silinen bir anahtar hala sizar, bu yuzden tum commit'ler de taraniyor.
          # (`fetch-depth: 0` tam da bunun icin; 25 commit'te ~0.1 sn suruyor.)
          if git grep -I -n -E "$PATTERN" $(git rev-list --all) -- . ; then
            echo "::error::Gecmiste gizli bilgi deseni bulundu"
            exit 1
          fi

          echo "Calisma agaci ve gecmis temiz"

      - name: .env commit edilmis mi
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env git tarafindan takip ediliyor"
            exit 1
          fi
          echo ".env takip edilmiyor"
