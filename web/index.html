<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derslik — Make A Playlist</title>
    <meta
      name="description"
      content="Bir konu yaz, sıralı bir ders planı al. Videoları izle, işaretle, kaynaklı soru sor."
    />
    <meta name="theme-color" content="#1b3a31" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap"
    />

    <script>
      // Temayı BOYAMADAN once uygula: React mount olana kadar gecen surede
      // yanlis temanin bir kare bile gorunmesi, gece calisan kullaniciya
      // beyaz ekran patlatiyordu.
      (function () {
        try {
          var saved = localStorage.getItem("derslik:theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <!--
      THESIS: Defter bir KOLEKSIYON, her kaynak bir eser, her alinti bir KUNYE.
      Reddedilen kategori varsayilani: krem kagit + serif "calisma defteri"
      goruntusu (bu urunun kendi onceki dunyasi) ve onun karsiti olan siyah +
      neon "yapay zeka araci" goruntusu.

      OWN-WORLD: Markanin kendi yesili (#1b3a31) artik bir SALON DUVARI ve
      butun bir bolgeye sahip -- gezinmeyi, bolum basligini ve "su an
      buradasin"i tasir. Degisen sey rengin kendisi degil ne kadar YER
      kapladigi: eskiden 248 piksellik bir seritti. Beyaz etiket kartonu (#ffffff)
      okunan her seyi; galeri grisi zemin (#e8eae5) rengin gorunmesi icin
      renksiz kalir. Alti SALON RENGI (--key-1..6) kaynaklari anahtarlar: bir
      kaynagin rengi kunyesinde, kenar bandinda ve transkript isaretinde
      AYNIDIR. Yonlendirme okrasi (#b4700f) tek sinyal. Archivo = kurum
      konusuyor; Literata = duvar metni; mono = KUNYE (zaman kodu, sayfa).
      Kose keskin (3-8px), golge degil cizgi.

      STORY: Tek soru sorulur, plan bir guzergah olarak kurulurken izlenir,
      numarali unitelerden olusan bir koleksiyon cikar, ve o koleksiyona soru
      sorulup kunyeden videonun tam saniyesine gidilir.

      FIRST VIEWPORT: Solda ultramarin duvar, uc durak. Galeri grisi zeminde
      tek buyuk soru, altinda tek genis alan, dort gercek ornek konu.
      Birincil eylem alanin hemen altinda.

      FORM: Muze etiketi ve galeri yonlendirmesi. Kendi siralamamda 4.;
      zar atandi, kullanici kilitledi. Seed: e10af0da (re-roll 1).

      SIGNATURE: Yanit geldiginde kunyeler SIRAYLA yerlesir -- galeride
      etiketlerin asilmasi. Tek orkestre edilmis an, dagitilmis hover degil.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
