[pytest]
# Bu dosya rootdir'i sabitliyor; testler `src`/`api` paketlerini depo kokunden
# import ediyor. Icerigi bosaltilsa bile dosyanin kendisi gerekli.
testpaths = tests
# pytest-asyncio bir bagimlilik DEGIL ve async test de yok. Kurulu oldugu
# ortamlarda (gelistirici makinesi) yapilandirilmadigi icin uyari basiyordu;
# yapilandirmak ise kurulu OLMAYAN ortamlarda (CI'in alt sinir isi) "bilinmeyen
# secenek" uyarisi veriyordu. Eklentiyi kapatmak ikisini birden cozuyor.
addopts = -p no:asyncio
